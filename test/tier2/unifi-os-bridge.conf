# UniFi-OS dialect bridge.
#
# The provider only speaks the UniFi-OS console dialect — it logs in at
# /api/auth/login and prefixes every Network call with /proxy/network. The
# linuxserver Docker image is the *standalone* Network Application, which serves
# /api/login and the bare /api/... + /v2/... paths. This proxy maps one onto the
# other so the unmodified provider can drive the Docker controller for Tier-2.
#
# It only rewrites paths: auth rides the unifises session cookie (the standalone
# does not enforce CSRF), and proxy_cookie_flags drops the cookie's Secure flag
# so the session survives the plain-HTTP hop from the provider to this bridge.
events {}

http {
  server {
    listen 8443;

    proxy_ssl_verify off;             # the controller's cert is self-signed
    proxy_cookie_flags ~ nosecure;    # let the session cookie ride plain HTTP
    proxy_set_header Host $host;

    # UniFi-OS login path → standalone login path.
    location = /api/auth/login {
      proxy_pass https://controller:8443/api/login;
    }

    # Strip the UniFi-OS /proxy/network prefix the provider adds to every call.
    location /proxy/network/ {
      rewrite ^/proxy/network/(.*)$ /$1 break;
      proxy_pass https://controller:8443;
    }

    location / {
      proxy_pass https://controller:8443;
    }
  }
}
