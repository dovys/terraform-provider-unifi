# oapi-codegen config for `go generate` (see gen.go).
#
# Types only: models + enum constants. Operations and the ergonomic substruct
# client are hand-written in the parent `protect` package — the generated
# operation layer keys off the reverse-engineered private-API operationIds and
# is deliberately not generated. skip-prune keeps every modeled object's type
# available for the facade to pick from.
package: wire
output: types.gen.go
generate:
  models: true
output-options:
  skip-prune: true
  # The controller returns `date-time` fields as epoch-millis numbers, RFC 3339
  # strings, or null, inconsistently per field; plain time.Time rejects the
  # numeric form and one bad field fails the whole decode. FlexTime (flextime.go)
  # accepts all three. No import — it's in this same `wire` package.
  type-mapping:
    string:
      formats:
        date-time:
          type: FlexTime
