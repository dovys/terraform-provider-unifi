# oapi-codegen config for `go generate` (see gen.go).
#
# Types only: models + enum constants (with Valid() guards). Operations and the
# ergonomic substruct client are hand-written in the parent `network` package —
# the generated operation layer keys off noisy operationIds and is deliberately
# not generated. skip-prune keeps every modeled object's type available for the
# facade to pick from.
package: wire
output: types.gen.go
generate:
  models: true
output-options:
  skip-prune: true
