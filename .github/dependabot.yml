# Weekly dependency updates, grouped per ecosystem. Minor+patch bumps share one
# group PR, which dependabot-automerge.yml merges once CI is green (cutting a
# patch release). Majors get their own group PR and wait for a human.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: deps
    # A compromised release ships signed with no human look; most are yanked
    # within days. Security updates ignore cooldown.
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns: ["*"]
        update-types: [minor, patch]
      gomod-major:
        patterns: ["*"]
        update-types: [major]

  # Keeps the 3rd-party action SHA pins fresh and flags new majors for GitHub's own
  # floating-tag actions/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
      github-actions-major:
        patterns: ["*"]
        update-types: [major]
