# Weekly dependency updates (not daily — one batch per week keeps CI runs down).
# Volume is controlled by GROUPING, not a PR cap: each ecosystem folds ALL its
# bumps (major/minor/patch) into a SINGLE grouped PR, so a week yields at most two
# PRs — one gomod, one github-actions. Groups are per-ecosystem, so the two can't
# be merged further. If a breaking major ever blocks a grouped PR, close it and
# `ignore` that one dependency (or split it out).
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: deps
    groups:
      gomod:
        patterns: ["*"]
        update-types: [major, minor, patch]

  # Keeps the 3rd-party action SHA pins fresh and flags new majors for GitHub's own
  # floating-tag actions/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [major, minor, patch]
