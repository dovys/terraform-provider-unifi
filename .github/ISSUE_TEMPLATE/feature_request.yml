name: Feature request
description: A resource, field, or behavior the provider should support.
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What do you want, and why?
      description: Explain the use case — what you can't express today — and ideally show what the config would look like.
      placeholder: |
        I want to manage per-SSID schedules so guest WiFi turns off overnight.

        resource "unifi_network_wlan" "guest" {
          name = "guest"
          schedule { ... }
        }
    validations:
      required: true
