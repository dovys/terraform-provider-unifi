name: Bug report
description: A resource that doesn't plan, apply, or import the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The more you fill in, the faster this gets fixed — especially the
        **reproduce config** and **versions**. A bug we can't reproduce from your
        config usually can't be fixed.

        > **Scrub secrets** — API keys, passwords, PSKs, public IPs, MACs — from
        > the config and logs before posting.

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem in detail
      value: |
        Expected behavior:


        What happened instead:


        Logs:
    validations:
      required: true

  - type: input
    id: provider_version
    attributes:
      label: Provider version
      description: The `dovys/unifi` version, or `main` if built from source.
      placeholder: v0.3.0
    validations:
      required: true

  - type: input
    id: terraform_version
    attributes:
      label: Terraform / OpenTofu version
      description: From `terraform version`. The provider needs Terraform 1.5+.
      placeholder: v1.9.5
    validations:
      required: true

  - type: textarea
    id: stack_versions
    attributes:
      label: UniFi stack versions
      description: The console plus the affected app(s). Find them in the UniFi OS UI or via `unifi_network_application_info`. Drop the lines that don't apply.
      value: |
        - Console hardware: (e.g. UCG-Max, UDM-Pro, Cloud Key Gen2+)
        - UniFi OS:
        - Network:
        - Protect:
        - Access:
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest Terraform config that triggers the bug, plus the commands you ran.
      placeholder: |
        resource "unifi_network_wlan" "example" {
          name       = "example"
          security   = "wpapsk"
          passphrase = "REDACTED"
        }

        1. terraform apply
        2. terraform plan   # <- unexpected diff
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm using a **local UniFi OS admin account** (username + password), not a cloud/SSO account.
          required: true
        - label: I scrubbed secrets from the config and logs above.
          required: true
