name: auto-release

# Two-branch release model — CI only TAGS + RELEASES, never merges/pushes a branch.
#   main — released code; EVERY push auto-cuts a release (docs and all — simple = solid).
#   next — feature staging; never releases.
#
# No skip paths, no labels — the one decision is the bump, read from git TOPOLOGY (not
# the PR API). The old `commits/{sha}/pulls` read is eventually-consistent: seconds
# after a merge it can return [], which once silently mis-bumped a next→main minor down
# to a patch. Topology has no such race — a next→main release is the ONLY merge commit
# whose second parent is contained in `next` (the merge brings next's tip in as
# `HEAD^2`). So:
#   merge commit whose HEAD^2 ∈ next  → minor
#   anything else (squash-merged fix/docs/dep, direct push, or a fix merged AS a merge
#   commit whose HEAD^2 is NOT in next) → patch
# A major bump has no path yet — add one when v1.0 nears.

on:
  push:
    branches: [main]

# Serialize so two quick merges can't race the tag; never cancel an uploading release.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write        # push the tag, create the GitHub Release

jobs:
  release:
    # Self-hosted self-hosted runner (ARC, containerMode: kubernetes). The minimal
    # runner pod has no toolchain, so the job declares a container + sets up Go
    # in-job (setup-go); GoReleaser and the GPG-import action bring their own.
    runs-on: self-hosted
    container:
      image: ghcr.io/actions/actions-runner:latest
    # In a container job GitHub's default `run` shell is `sh` (dash), which lacks
    # `set -o pipefail`; force bash so the steps' strict-mode prelude works.
    defaults:
      run:
        shell: bash
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      # Release never re-resolves modules; -mod=readonly fails on a stale/tampered graph.
      GOFLAGS: -mod=readonly
    steps:
      # Runs with contents:write + (when set) the GPG key in memory. GitHub's own
      # actions ride floating major tags (we trust them); 3rd-party are SHA-pinned.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history + tags for the bump topology + version calc

      # Decide the bump from git alone — no PR API, no merge-message parsing, so the
      # commit→PR association lag can't mis-bump. `next` is fetched so HEAD^2 (the
      # merged-in tip of a next→main merge) can be tested for membership in it.
      - name: Decide bump from git topology
        id: decide
        run: |
          set -euo pipefail
          git fetch --no-tags origin next
          p2="$(git rev-parse -q --verify 'HEAD^2' || true)"   # empty unless HEAD is a merge
          if [ -n "$p2" ] && git merge-base --is-ancestor "$p2" origin/next; then
            bump=minor      # the next→main release merge — HEAD^2 is next's tip
          else
            bump=patch      # squash fix, direct push, or a fix merged as a merge commit
          fi
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "Releasing — bump ${bump} (HEAD^2=${p2:-<none, single-parent → patch>})"

      # Pin to the go.mod toolchain (see test.yml). cache:false — setup-go's auto
      # cache shares the PR job's key (native-arch, "not saved" on hit), so the
      # cross-compile never persists; the release-scoped cache below does instead.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Persist the cross-compile + module cache across releases (keyed go.mod+go.sum;
      # restore-keys warm the base on a change). #1 saves all six arches; #2+ restore
      # them, so GoReleaser recompiles only changed packages, not stdlib ×6.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            release-go-${{ runner.os }}-

      # Don't tag a tree that doesn't build/pass units (the only check for a direct
      # push to main); GoReleaser reuses this warm cache for the cross-compile.
      - name: Build & unit test
        run: |
          go build ./...
          go test ./... -timeout 120s

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            case "$BUMP" in
              major) next="v1.0.0" ;;
              minor) next="v0.1.0" ;;
              *)     next="v0.0.1" ;;
            esac
          else
            ver="${latest#v}"
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Latest tag '$latest' is not vX.Y.Z; refusing to guess." >&2
              exit 1
            fi
            major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
            case "$BUMP" in
              # minor/major reset the lower parts to 0.
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::Unknown bump '$BUMP'." >&2; exit 1 ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::Computed tag ${next} already exists." >&2
            exit 1
          fi
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${next} (${BUMP}; previous ${latest:-<none>})"

      # actions-runner ships gpg-agent but not the `gpg` CLI (apt
      # --no-install-recommends drops it) — the GPG-import action and GoReleaser
      # checksum signing both shell out to it. Install before the tag push so an
      # apt hiccup can't orphan a tag; idempotent; runner has NOPASSWD sudo.
      - name: Ensure gpg CLI is present
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg

      - name: Create and push tag
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"

      # Passphraseless key (a passphrase is dead weight in automation).
      - name: Import GPG key
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: '~> v2'
          # Full command in each branch: `X && '' || Y` always yields Y (the empty
          # string is falsy), which skipped signing on every release with a key set.
          args: ${{ env.HAS_GPG_KEY == 'true' && 'release --clean' || 'release --clean --skip=sign' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
