name: auto-release

# Two-branch release model — CI only TAGS + RELEASES, never merges/pushes a branch.
#   main — released code; every substantive push auto-cuts a release.
#   next — feature staging; never releases.
# Bump from the merged PR's head + labels:
#   fix → main = patch · next → main = minor · +release:major = major · release:skip = none
#
# One `release` job: step 1 reads the PR to decide release+bump (a job-level `if`
# can't call the PR API); every later step is gated on it. Tag + GoReleaser share
# the job because a tag pushed with GITHUB_TOKEN won't trigger a separate workflow.

on:
  push:
    branches: [main]
    # Skip non-functional merges (skips only when EVERY changed file matches; use
    # the release:skip label for code you don't want released).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'go.mod'
      - 'go.sum'

# Serialize so two quick merges can't race the tag; never cancel an uploading release.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write        # push the tag, create the GitHub Release
  pull-requests: read    # read the merged PR's branch + labels

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      # Release never re-resolves modules; -mod=readonly fails on a stale/tampered graph.
      GOFLAGS: -mod=readonly
    steps:
      # Decide before checkout/Go so a release:skip merge exits in seconds; gh is
      # preinstalled and needs no checkout.
      - name: Decide release + bump from the merged PR
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          resp="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')"
          head="$(printf '%s' "$resp"   | jq -r  'if length>0 then .[0].head.ref else "" end')"
          labels="$(printf '%s' "$resp" | jq -c  'if length>0 then [.[0].labels[].name] else [] end')"
          has() { printf '%s' "$labels" | jq -e --arg l "$1" 'index($l) != null' >/dev/null 2>&1; }

          if has "release:skip"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release:skip label present on the merged PR — skipping the release."
            exit 0
          fi
          if [ "$head" = "next" ]; then
            if has "release:major"; then bump=major; else bump=minor; fi
          else
            bump=patch
          fi
          echo "release=true"  >> "$GITHUB_OUTPUT"
          echo "bump=${bump}"  >> "$GITHUB_OUTPUT"
          echo "Release: yes — bump ${bump} (merged PR head: ${head:-<none, direct push → patch>})"

      # Pinned SHA — runs with contents:write + (when set) the GPG key in memory.
      - if: steps.decide.outputs.release == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0          # full history + tags for version calc

      # Pin to the go.mod toolchain (see test.yml).
      - if: steps.decide.outputs.release == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      # Don't tag a tree that doesn't build/pass units (the only check for a direct
      # push to main); GoReleaser reuses this warm cache for the cross-compile.
      - name: Build & unit test
        if: steps.decide.outputs.release == 'true'
        run: |
          go build ./...
          go test ./... -timeout 120s

      - name: Compute next version
        id: ver
        if: steps.decide.outputs.release == 'true'
        env:
          BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            case "$BUMP" in
              major) next="v1.0.0" ;;
              minor) next="v0.1.0" ;;
              *)     next="v0.0.1" ;;
            esac
          else
            ver="${latest#v}"
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Latest tag '$latest' is not vX.Y.Z; refusing to guess." >&2
              exit 1
            fi
            major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
            case "$BUMP" in
              # minor/major reset the lower parts to 0.
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::Unknown bump '$BUMP'." >&2; exit 1 ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::Computed tag ${next} already exists." >&2
            exit 1
          fi
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${next} (${BUMP}; previous ${latest:-<none>})"

      - name: Create and push tag
        if: steps.decide.outputs.release == 'true'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"

      # Passphraseless key (a passphrase is dead weight in automation).
      - name: Import GPG key
        if: ${{ steps.decide.outputs.release == 'true' && env.HAS_GPG_KEY == 'true' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        if: steps.decide.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: '~> v2'
          # Full command in each branch: `X && '' || Y` always yields Y (the empty
          # string is falsy), which skipped signing on every release with a key set.
          args: ${{ env.HAS_GPG_KEY == 'true' && 'release --clean' || 'release --clean --skip=sign' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
