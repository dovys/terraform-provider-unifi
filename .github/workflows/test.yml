name: test

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable' # always build/test on the latest stable Go
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"
            echo "Run: gofmt -s -w ."
            exit 1
          fi
      # Docs are generated from the provider schema + examples. Keep them current
      # at merge so every released commit carries fresh docs (the release flow
      # never regenerates docs). Runs ONLY tfplugindocs — NOT `go generate ./...`,
      # which would invoke the wire codegen that needs the sibling ../unifi-specs
      # repo (absent in CI).
      - name: docs are current
        run: |
          go tool tfplugindocs generate --provider-name unifi
          if ! git diff --exit-code docs/; then
            echo "::error::docs/ is stale — run 'make docs' and commit the result."
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true
      # golangci-lint refuses to run when its build Go is older than the module's
      # go directive (go 1.26.3). install-mode goinstall builds golangci-lint
      # from source with the setup-go toolchain (latest stable, >= our floor),
      # so the binary's Go always satisfies the directive.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true
      - run: go test ./... -timeout 120s -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out | tail -1
