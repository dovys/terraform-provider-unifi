name: test

# One `checks` job: GitHub bills per job rounded up to the minute, so six parallel
# jobs each reinstalling Go + recompiling cost ~10 min/run for near-instant work.
# Sharing one setup-go + build cache roughly halves it. Unit tests run only on PRs
# into `main` (the release-bound merges); `next` PRs skip them.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'

# Cancel a PR branch's in-flight run when a new push supersedes it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full SHAs (mutable tags are a supply-chain risk);
      # Dependabot bumps the SHA + version comment together.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # First (needs only the checkout) so the secret-leak guard isn't hidden
      # behind a later build failure.
      - name: secret hygiene
        run: ./scripts/check-secrets.sh

      # Pin Go to the go.mod toolchain, not `stable`: `stable`'s version is part of
      # setup-go's cache key, so a new Go release would void the whole module+build
      # cache (and the golangci-lint goinstall build) and force a full recompile.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"
            echo "Run: gofmt -s -w ."
            exit 1
          fi

      # Release builds with -mod=readonly and no `go mod tidy`, so catch an untidy
      # module here instead of at release time.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum not tidy — run 'go mod tidy' and commit."
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # tfplugindocs only — `go generate` would run the wire codegen, which needs
      # the sibling ../unifi-specs repo (absent in CI).
      - name: docs are current
        run: |
          go tool tfplugindocs generate --provider-name unifi
          if ! git diff --exit-code docs/; then
            echo "::error::docs/ is stale — run 'make docs' and commit the result."
            exit 1
          fi

      # Cache the goinstall-built golangci-lint binary — building it from source is
      # the ~80s bulk here and setup-go's shared cache never persists it. Keyed by
      # lint version × go.mod toolchain; goinstall (not prebuilt) so its build Go
      # satisfies the module's go directive. The action runs the cached binary
      # (install-mode: none, found via $GOPATH/bin on PATH) for caching + annotations.
      - name: Cache golangci-lint binary
        id: golangci-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-bin-${{ runner.os }}-v2.12.2-${{ hashFiles('go.mod') }}
      - if: steps.golangci-bin.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12.2
          install-mode: none

      # Same for govulncheck. Fails on any known vuln in our call graph — deps +
      # stdlib (the latter via the pinned go.mod toolchain).
      - name: Cache govulncheck binary
        id: govulncheck-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-bin-${{ runner.os }}-v1.3.0-${{ hashFiles('go.mod') }}
      - name: govulncheck
        run: |
          [ -x "$(go env GOPATH)/bin/govulncheck" ] || go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      # Example HCL is shipped docs (tfplugindocs renders it) — keep it formatted.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive examples/

      # Only on release-bound PRs (base main); run `make test` locally on `next`
      # PRs — they re-run here at the `next → main` merge.
      - name: unit tests
        if: github.base_ref == 'main'
        run: |
          go test ./... -timeout 120s -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
