# Keep golangci-lint v2's default set (errcheck, govet, ineffassign, staticcheck,
# unused) and add a spelling check. Formatting (gofmt -s) is enforced by the
# `build` CI job, not here.
version: "2"

linters:
  enable:
    - misspell
  settings:
    misspell:
      # `dynamicdns` is the controller's REST type (the `/rest/dynamicdns` doc),
      # not a misspelling of "dynamics".
      ignore-rules:
        - dynamicdns
