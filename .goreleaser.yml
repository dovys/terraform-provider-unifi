# GoReleaser config for a Terraform Registry provider release.
# Driven by .github/workflows/auto-release.yml, which tags the next patch on
# every substantive merge to main and runs `goreleaser release` in the same job.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    # Only the platforms real Terraform users run: linux, macOS, and Windows on
    # amd64 (x86-64) and arm64. We deliberately drop freebsd, 386, and 32-bit arm
    # — no meaningful Terraform audience, and dropping them roughly halves the
    # release matrix (and build time). The repo isn't on the Terraform Registry,
    # so there's no platform-coverage requirement to satisfy.
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: ['zip']
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

# Release notes are auto-derived from the commit log between tags. The curated
# human narrative lives in CHANGELOG.md (date-based, maintained in PRs); this is
# the per-version mechanical list. Filter out non-functional commit prefixes and
# merge commits. Each line is "[short-sha](commit-url) subject" — GitHub renders
# the markdown as a clickable abbreviated-hash link (full SHA in the URL so it
# always resolves).
changelog:
  use: git
  sort: asc
  format: "[{{ slice .SHA 0 7 }}](https://github.com/dovys/terraform-provider-unifi/commit/{{ .SHA }}) {{ .Message }}"
  filters:
    exclude:
      - '^deps:'
      - '^ci:'
      - '^chore:'
      - '^docs:'
      - '^test:'
      - '^Merge '
